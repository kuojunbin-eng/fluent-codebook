name: Build and publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm check
      - name: Build
        run: pnpm build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Start preview server
        run: pnpm preview --host 127.0.0.1 --port 4173 > /tmp/fluent-codebook-preview.log 2>&1 &
      - name: Test Spanish and French audio links
        run: |
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:audio-links:http
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist/public
          force_orphan: true
